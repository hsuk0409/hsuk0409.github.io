- title: "Clean-Edu"
  status: "in-progress"
  description: "악성 학부모의 상습 민원 및 폭언 등으로부터 교사의 정신건강을 보호하기 위한 지능형 교직원 보호 SaaS. 카카오 로그인 기반 WebRTC 화상/음성 상담에서 실시간 STT로 학부모의 반복 발언을 감지하면 자동으로 Mute 처리 후 안내방송을 송출하는 기능까지 구현 완료. 이후 즉각적인 비상 알림(카카오톡 등) 기능 개발 예정"
  tech_stack: ["Next.js", "React", "TypeScript", "Supabase", "WebRTC", "Web Speech API (STT)", "Kakao OAuth", "Tailwind CSS", "Vitest"]
  url: "https://github.com/hsuk0409/clean-edu"

